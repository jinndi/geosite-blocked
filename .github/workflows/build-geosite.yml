name: Build Geosite

on:
  workflow_dispatch:
  schedule:
    # Запуск каждый понедельник в 07:37 UTC (10:37 МСК)
    - cron: '37 7 * * 1'

env:
  SINGBOX_VERSION: 1.12.25

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Process domain files
      run: |
        python << 'EOF'
        import os
        import json
        import urllib.request
        import urllib.error

        # Текстовые .lst источники
        urls = {
            "community.antifilter.lst": "https://community.antifilter.download/list/domains.lst",
            "community.1andrevich.lst": "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/community.lst",
            "itdoginfo.russia.inside.lst": "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/inside-raw.lst",
            "opencck.all.lst": "https://iplist.opencck.org/?format=text&data=domains&wildcard=1&group=ai&group=anime&group=art&group=casino&group=discord&group=education&group=finance&group=games&group=hosting&group=jetbrains&group=messengers&group=news&group=porn&group=shop&group=socials&group=tools&group=torrent&group=video&group=youtube"
        }

        # JSON источники, из которых извлекаются domain и domain_suffix
        json_urls = {
            "ai.lst": "https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset/ai.json",
            "games.lst": "https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset/games.json",
            "networktest.lst": "https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset/networktest.json",
            "youtube.lst": "https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset/youtube.json",
            "media.lst": "https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box-ruleset/media.json",
            "meta.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/meta.json",
            "cdn.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/category-cdn-!cn.json",
            "communication.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/category-communication.json",
            "news.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/category-media-ru-blocked.json",
            "crypto.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/category-cryptocurrency.json",
            "apple.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/apple.json",
            "firefox.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/firefox.json",
            "google.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/google.json",
            "microsoft.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/microsoft.json",
            "ubuntu.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/ubuntu.json",
            "steam.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/steam.json",
            "telegram.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/telegram.json",
            "twitter.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/twitter.json",
            "tiktok.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/tiktok.json",
            "reddit.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/reddit.json",
            "github.lst": "https://raw.githubusercontent.com/KaringX/karing-ruleset/sing/geo/geosite/github.json"
        }

        folder = 'data'
        # ------------------------

        if not os.path.exists(folder):
            os.makedirs(folder)

        headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

        print("--- Старт скачивания LST файлов ---")
        for filename, url in urls.items():
            filepath = os.path.join(folder, filename)
            print(f"Скачиваю/Обновляю: {url} -> {filepath}")
            try:
                req = urllib.request.Request(url, headers=headers)
                with urllib.request.urlopen(req, timeout=30) as response, open(filepath, 'wb') as out_file:
                    out_file.write(response.read())
                print(f"Успешно обновлен: {filename}")
            except urllib.error.URLError as e:
                print(f"Ошибка при скачивании {url} (оставлена старая версия): {e}")
            except Exception as e:
                print(f"Непредвиденная ошибка для {url}: {e}")

        print("\n--- Скачивание и парсинг JSON источников ---")
        for filename, url in json_urls.items():
            filepath = os.path.join(folder, filename)
            print(f"Парсинг JSON: {url} -> {filepath}")
            try:
                req = urllib.request.Request(url, headers=headers)
                with urllib.request.urlopen(req, timeout=30) as response:
                    json_data = json.loads(response.read().decode('utf-8'))

                extracted_domains = []
                for rule in json_data.get('rules', []):
                    extracted_domains.extend(rule.get('domain', []))
                    extracted_domains.extend(rule.get('domain_suffix', []))

                # Извлечение уникальных непустых записей
                unique_extracted = sorted(list(set(d.strip() for d in extracted_domains if d and isinstance(d, str))))

                with open(filepath, 'w', encoding='utf-8') as out_file:
                    for d in unique_extracted:
                        out_file.write(f"{d}\n")

                print(f"Успешно извлечено {len(unique_extracted)} доменов в {filename}")
            except Exception as e:
                print(f"Ошибка при обработке JSON {url}: {e}")

        print("--- Скачивание завершено ---\n")

        # --- Обработка всех LST в папке data ---
        domains = set()
        stats = {"total_lines": 0}

        def process_line(line):
            line = line.strip()
            line = line.replace('\xa0', ' ').strip()
            if '#' in line:
                line = line.split('#')[0].strip()
            if not line or line.startswith('#'):
                return
            if ' ' in line:
                line = line.split()[0]

            stats["total_lines"] += 1
            domain = line.lower().strip()
            
            if domain.endswith('.'):
                domain = domain[:-1]
            if domain.startswith('*.') :
                domain = domain[2:]
            elif domain.startswith('.'):
                domain = domain[1:]
            if domain.startswith('www.'):
                domain = domain[4:]
                
            if domain and "." in domain:
                domains.add(domain)

        if os.path.exists(folder):
            for filename in os.listdir(folder):
                if filename.endswith('.lst'):
                    print(f"Читаю файл: {filename}")
                    with open(os.path.join(folder, filename), 'r', encoding='utf-8') as f:
                        for line in f:
                            process_line(line)
        else:
            print(f"Предупреждение: Стартовая папка {folder} не найдена!")

        unique_domains = []
        sorted_domains = sorted(list(domains), key=len)
        processed_parents = set()

        for d in sorted_domains:
            parts = d.split('.')
            is_subdomain = False
            for i in range(len(parts) - 1, 0, -1):
                parent = '.'.join(parts[i:])
                if parent in processed_parents:
                    is_subdomain = True
                    break
            
            if not is_subdomain:
                unique_domains.append(d)
                processed_parents.add(d)
        
        unique_domains.sort()

        result = {
          "version": 3,
          "rules": [{
            "domain_suffix": unique_domains
          }]
        }
        
        with open('geosite-blocked.json', 'w', encoding='utf-8') as f:
          json.dump(result, f, ensure_ascii=False, indent=2)
        
        print(f"Итог {len(unique_domains)} уникальных доменов (из {stats['total_lines']} валидных исходных строк)")
        EOF
    - name: Install sing-box
      run: |
        wget https://github.com/SagerNet/sing-box/releases/download/v${{ env.SINGBOX_VERSION }}/sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
        tar -xzf sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
        sudo mv sing-box*/sing-box /usr/local/bin/
        chmod +x /usr/local/bin/sing-box

    - name: Convert to srs format
      run: |
        sing-box rule-set compile geosite-blocked.json -o geosite-blocked.srs

    - name: Count domains
      id: count_domains
      run: |
        COUNT=$(python -c "
        import json
        with open('geosite-blocked.json', 'r', encoding='utf-8') as f:
          data = json.load(f)
        print(len(data['rules'][0]['domain_suffix']))
        ")
        echo "count=$COUNT" >> $GITHUB_OUTPUT

    - name: Commit files to repository
      env:
        TZ: "Europe/Moscow"
      run: |
        if [ -z "$(git status --porcelain geosite-blocked.json geosite-blocked.srs)" ]; then
          echo "No changes in generated files; skipping commit."
        else
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data geosite-blocked.json geosite-blocked.srs
          git commit -m "[auto] Update geosite-blocked $(date '+%Y-%m-%d %H:%M:%S')"
          git pull origin main --rebase
          git push

          curl -sfL "https://purge.jsdelivr.net/gh/jinndi/geosite-blocked@main/geosite-blocked.srs"
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.${{ github.run_number }}
        name: Релиз 1.${{ github.run_number }}
        files: |
          geosite-blocked.json
          geosite-blocked.srs
        body: |
          Автоматическая публикация файлов geosite-blocked
          Всего доменов: ${{ steps.count_domains.outputs.count }}
          - geosite-blocked.json: JSON формат
          - geosite-blocked.srs: Sing-box rule_set формат
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}