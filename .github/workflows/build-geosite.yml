name: Build Geosite

on:
  workflow_dispatch:
  schedule:
    # Запуск каждый понедельник в 06:37 UTC (09:37 МСК)
    - cron: '37 6 * * 1'

env:
  SINGBOX_VERSION: 1.12.25

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Process domain files
      run: |
        python << 'EOF'
        import os
        import json
        import shutil
        import urllib.request
        import urllib.error

        # ПАРАМЕТРЫ
        urls = {
            "community.antifilter.lst": "https://community.antifilter.download/list/domains.lst",
            "community.1andrevich.lst": "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/community.lst",
            "opencck.all.lst": "https://iplist.opencck.org/?format=text&data=domains&wildcard=1&group=ai&group=anime&group=art&group=casino&group=discord&group=education&group=finance&group=games&group=hosting&group=jetbrains&group=messengers&group=news&group=porn&group=shop&group=socials&group=tools&group=torrent&group=video&group=youtube",
            "opencck.all.beta.lst": "https://beta.iplist.opencck.org/?format=text&data=domains&wildcard=1&site=adobe.com&site=adobe%40activation&site=adobe%40admin&site=adobe%40authentication&site=adobe%40behance&site=adobe%40cloud&site=adobe%40deploy&site=adobe%40podcast&site=adobe%40updater&site=amazon.com&site=amazon%40cloudfront.net&site=amazon%40hls.live-video.net&site=amazon%40live-video.net&site=amazon%40playlist.live-video.net&site=amazon%40signin.aws&site=chime.aws&site=kick.com&site=kick%40live-video.net&site=aniliberty.top&site=mangalib.me&site=apple.com&site=apple%40appstore.com&site=apple%40device&site=apple%40icloud.com&site=apple%40itunes.com&site=apple%40metrics&site=apple%40opensource&site=apple%40other&site=apple%40shazam.com&site=apple%40tech&site=wattpad.com&site=blitz.gg&site=brawlstars.com&site=centurygame.com&site=ea.com%40battlefield1&site=ea.com%40battlefield2042&site=ea.com%40cdn&site=epicgames.com&site=leagueoflegends.com&site=r.e.p.o&site=roblox.com&site=steampowered.com&site=umamusume.com&site=google.com&site=google%40aistudio&site=google%40android&site=google%40blogspot&site=google%40firebase&site=google%40flutter.dev&site=google%40gemini&site=google%40go.dev&site=google%40google-ads&site=google%40google-gemini&site=google%40google-play&site=google%40google-registry&site=google%40google-scholar&site=google%40google-trust-services&site=google%40googleapis.com&site=google%40googlefcm&site=google%40googleusercontent.com&site=google%40kaggle&site=google%40notebooklm&site=google%40opensourceinsights&site=google%40other&site=cloudflare.com&site=digitalocean.com&site=imo.im&site=slack.com&site=microsoft.com&site=microsoft%40azure&site=microsoft%40bing.com&site=microsoft%40dev&site=microsoft%40mojang.com&site=microsoft%40msn.com&site=microsoft%40npmjs.com&site=microsoft%40onedrive.live.com&site=microsoft%40pki&site=microsoft%40windowsupdate&site=microsoft%40xbox.com&site=visualstudio.com&site=ui.com&site=bsky.app&site=github.com&site=reddit.com&site=aidungeon.com&site=anydesk.com&site=cohere.com&site=figma.com&site=mega.io&site=openwrt.org&site=speedtest.net&site=themeforest.net&site=yootheme.com&site=twitch.tv&site=twitch%407tv.app&site=twitch%40amazonaws.com&site=twitch%40cloudfront.net&site=twitch%40ext-twitch.tv&site=twitch%40live-video.net&site=twitch%40ttvnw.net&site=antifriz.tv",
            "itdoginfo.ru.inside.lst": "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/inside-raw.lst"
        }
        folder = 'data'
        # ------------------------

        if not os.path.exists(folder):
            os.makedirs(folder)

        print("--- Старт скачивания файлов ---")
        for filename, url in urls.items():
            filepath = os.path.join(folder, filename)
            print(f"Скачиваю/Обновляю: {url} -> {filepath}")
            try:
                req = urllib.request.Request(
                    url, 
                    headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
                )
                with urllib.request.urlopen(req, timeout=30) as response, open(filepath, 'wb') as out_file:
                    out_file.write(response.read())
                print(f"Успешно обновлен: {filename}")
            except urllib.error.URLError as e:
                print(f"Ошибка при скачивании {url} (оставлена старая версия): {e}")
            except Exception as e:
                print(f"Непредвиденная ошибка для {url}: {e}")

        print("--- Скачивание завершено ---\n")

        # --- Обработка ---
        domains = set()
        stats = {"total_lines": 0}

        def process_line(line):
            line = line.strip()
            line = line.replace('\xa0', ' ').strip()
            if '#' in line:
                line = line.split('#')[0].strip()
            if not line or line.startswith('#'):
                return
            if ' ' in line:
                line = line.split()[0]

            stats["total_lines"] += 1
            domain = line.lower().strip()
            
            if domain.endswith('.'):
                domain = domain[:-1]
            if domain.startswith('www.'):
                domain = domain[4:]
                
            if domain and "." in domain:
                domains.add(domain)

        if os.path.exists(folder):
            for filename in os.listdir(folder):
                if filename.endswith('.lst'):
                    print(f"Читаю файл: {filename}")
                    with open(os.path.join(folder, filename), 'r', encoding='utf-8') as f:
                        for line in f:
                            process_line(line)
        else:
            print(f"Предупреждение: Стартовая папка {folder} не найдена!")

        unique_domains = []
        sorted_domains = sorted(list(domains), key=len)
        processed_parents = set()

        for d in sorted_domains:
            parts = d.split('.')
            is_subdomain = False
            for i in range(len(parts) - 1, 0, -1):
                parent = '.'.join(parts[i:])
                if parent in processed_parents:
                    is_subdomain = True
                    break
            
            if not is_subdomain:
                unique_domains.append(d)
                processed_parents.add(d)
        
        unique_domains.sort()

        result = {
          "version": 3,
          "rules": [{
            "domain_suffix": unique_domains
          }]
        }
        
        with open('geosite-blocked.json', 'w', encoding='utf-8') as f:
          json.dump(result, f, ensure_ascii=False, indent=2)
        
        print(f"Итог {len(unique_domains)} уникальных доменов (из {stats['total_lines']} валидных исходных строк)")
        EOF
    - name: Install sing-box
      run: |
        wget https://github.com/SagerNet/sing-box/releases/download/v${{ env.SINGBOX_VERSION }}/sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
        tar -xzf sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz
        sudo mv sing-box*/sing-box /usr/local/bin/
        chmod +x /usr/local/bin/sing-box

    - name: Convert to srs format
      run: |
        sing-box rule-set compile geosite-blocked.json -o geosite-blocked.srs

    - name: Count domains
      id: count_domains
      run: |
        COUNT=$(python -c "
        import json
        with open('geosite-blocked.json', 'r', encoding='utf-8') as f:
          data = json.load(f)
        print(len(data['rules'][0]['domain_suffix']))
        ")
        echo "count=$COUNT" >> $GITHUB_OUTPUT

    - name: Commit files to repository
      env:
        TZ: "Europe/Moscow"
      run: |
        if [ -z "$(git status --porcelain geosite-blocked.json geosite-blocked.srs)" ]; then
          echo "No changes in generated files; skipping commit."
        else
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data geosite-blocked.json geosite-blocked.srs
          git commit -m "[auto] Update geosite-blocked $(date '+%Y-%m-%d %H:%M:%S')"
          git push

          curl -sfL "https://purge.jsdelivr.net/gh/jinndi/geosite-blocked@main/geosite-blocked.srs"
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.${{ github.run_number }}
        name: Релиз 1.${{ github.run_number }}
        files: |
          geosite-blocked.json
          geosite-blocked.srs
        body: |
          Автоматическая публикация файлов geosite-blocked
          Всего доменов: ${{ steps.count_domains.outputs.count }}
          - geosite-blocked.json: JSON формат
          - geosite-blocked.srs: Sing-box rule_set формат
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
