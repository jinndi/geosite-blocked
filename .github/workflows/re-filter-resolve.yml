name: Check and Filter External Domains

on:
  workflow_dispatch:
  schedule:
    # Запуск каждый понедельник в 04:37 UTC (07:37 МСК)
    - cron: '37 4 * * 1'

jobs:
  process-refilter:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install geoip2 dnspython

      - name: Download, resolve and filter domains
        run: |
          python -c "
          import os
          import urllib.request
          import concurrent.futures
          import geoip2.database
          import dns.resolver

          url = 'https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/domains_all.lst'
          folder = 'data'
          dst_lst = os.path.join(folder, 'refilter_resolved.lst')
          raw_lst = 'refilter_raw.lst'
          excluded_lst = 'refilter_raw_excluded.lst'
          geoip_db_path = 'GeoLite2-Country.mmdb'

          # Белый список TLD РФ (оставляем ТОЛЬКО их)
          allowed_ru_tlds = (
              '.moscow', '.ru', '.su', '.tatar', '.рф', '.москва', '.дети',
              '.xn--80adxhks', '.xn--80asehdb', '.xn--80aswg', 
              '.xn--c1avg', '.xn--d1acj3b', '.xn--p1acf', '.xn--p1ai',
              '.ru.com', '.ru.net'
          )

          if not os.path.exists(folder):
              os.makedirs(folder)

          # 1. Скачивание списка доменов
          print(f'Скачивание списка доменов из: {url}')
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8')
              
              raw_domains = [line.strip() for line in content.splitlines() if line.strip() and not line.startswith('#')]
              print(f'Загружено всего доменов: {len(raw_domains)}')
          except Exception as e:
              print(f'Ошибка при скачивании файла: {e}')
              exit(1)

          # Сохраняем исходный необработанный список в корень
          with open(raw_lst, 'w', encoding='utf-8') as raw_f:
              for d in raw_domains:
                  raw_f.write(f'{d}\n')

          # Подключаем GeoIP
          reader = None
          if os.path.exists(geoip_db_path):
              try:
                  reader = geoip2.database.Reader(geoip_db_path)
                  print('База GeoIP успешно загружена.')
              except Exception as e:
                  print(f'Ошибка загрузки GeoIP: {e}')
          else:
              print(f'Предупреждение: Файл {geoip_db_path} не найден!')

          # 2. БЫСТРАЯ ПРЕДВАРИТЕЛЬНАЯ ФИЛЬТРАЦИЯ (Без сети)
          domains_to_check = []
          failed_domains = []

          tld_filtered = 0
          digits_filtered = 0

          for domain in raw_domains:
              domain_lower = domain.lower()

              # Фильтр 1: Проверка по белым TLD РФ
              if not domain_lower.endswith(allowed_ru_tlds):
                  failed_domains.append((domain, 'NOT_RU_TLD'))
                  tld_filtered += 1
                  continue

              # Фильтр 2: Цифры
              try:
                  decoded_domain = domain.encode('idna').decode('utf-8') if not domain_lower.startswith('xn--') else domain.encode('utf-8').decode('idna')
              except Exception:
                  decoded_domain = domain

              main_name = decoded_domain.rsplit('.', 1)[0]
              digit_count = sum(c.isdigit() for c in main_name)

              if digit_count >= 4:
                  failed_domains.append((domain, 'TOO_MANY_DIGITS'))
                  digits_filtered += 1
                  continue

              domains_to_check.append(domain)

          print(f'Отсеяно (не РФ TLD): {tld_filtered}')
          print(f'Отсеяно по цифрам: {digits_filtered}')
          print(f'Отправляется на DNS-резолв и GeoIP: {len(domains_to_check)}')

          # Настройка системного резолвера
          sys_resolver = dns.resolver.Resolver()
          sys_resolver.timeout = 1.0
          sys_resolver.lifetime = 2.0

          # Fallback-резолвер
          fallback_resolver = dns.resolver.Resolver(configure=False)
          fallback_resolver.nameservers = ['1.1.1.1', '8.8.8.8']
          fallback_resolver.timeout = 1.5
          fallback_resolver.lifetime = 2.5

          def check_domain_dns_and_geoip(domain):
              answers = None

              # Резолвим для получения IP
              for resolver in (sys_resolver, fallback_resolver):
                  try:
                      answers = resolver.resolve(domain, 'A')
                      if answers:
                          break
                  except Exception:
                      pass

              # Если не отрезолвился — ИСКЛЮЧАЕМ
              if not answers:
                  return domain, True, 'DNS_RESOLVE_FAILED'

              # Если отрезолвился — проверяем страну через GeoIP
              for rdata in answers:
                  ip = rdata.to_text()
                  country_code = None

                  if reader:
                      try:
                          response = reader.country(ip)
                          country_code = response.country.iso_code
                      except Exception:
                          country_code = None

                  # Если код не определился — ИСКЛЮЧАЕМ
                  if not country_code:
                      return domain, True, 'UNKNOWN_GEOIP'

                  # Если код RU — ОСТАВЛЯЕМ
                  if country_code == 'RU':
                      return domain, False, 'OK'

                  # Если код определился и это НЕ RU — ИСКЛЮЧАЕМ
                  return domain, True, 'NOT_RU_GEOIP'

              return domain, True, 'UNKNOWN_GEOIP'

          filtered_domains = []
          dns_failed_filtered = 0
          not_ru_geoip_filtered = 0
          unknown_geoip_filtered = 0

          print('Начинаем многопоточную проверку DNS & GeoIP (40 потоков)...')
          
          with concurrent.futures.ThreadPoolExecutor(max_workers=40) as executor:
              results = list(executor.map(check_domain_dns_and_geoip, domains_to_check))

          for domain, is_ignored, reason in results:
              if is_ignored:
                  failed_domains.append((domain, reason))
                  if reason == 'DNS_RESOLVE_FAILED':
                      dns_failed_filtered += 1
                  elif reason == 'NOT_RU_GEOIP':
                      not_ru_geoip_filtered += 1
                  elif reason == 'UNKNOWN_GEOIP':
                      unknown_geoip_filtered += 1
              else:
                  filtered_domains.append(domain)

          # 3. Сохранение результатов
          with open(dst_lst, 'w', encoding='utf-8') as out_f:
              for d in sorted(filtered_domains):
                  out_f.write(f'{d}\n')

          with open(excluded_lst, 'w', encoding='utf-8') as ex_f:
              for d, reason in sorted(failed_domains):
                  ex_f.write(f'{d} # {reason}\n')

          print('\n--- ИТОГИ ПРОВЕРКИ ---')
          print(f'Всего обработано доменов: {len(raw_domains)}')
          print(f'Удалено (не РФ TLD): {tld_filtered}')
          print(f'Удалено из-за >= 4 цифр: {digits_filtered}')
          print(f'Удалено из-за ошибок DNS (не резолвятся): {dns_failed_filtered}')
          print(f'Удалено по GeoIP (не RU страна): {not_ru_geoip_filtered}')
          print(f'Удалено по GeoIP (неизвестный IP): {unknown_geoip_filtered}')
          print(f'Оригинальный список сохранен в: {raw_lst}')
          print(f'Успешно сохранено доменов в: {dst_lst} ({len(filtered_domains)} шт.)')
          print(f'Исключения сохранены в: {excluded_lst}')
          "

      - name: Commit and Push changes
        env:
          TZ: "Europe/Moscow"
        run: |
          if [ -z "$(git status --porcelain data/refilter_resolved.lst refilter_raw.lst refilter_raw_excluded.lst)" ]; then
            echo "Изменений в файлах нет."
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/refilter_resolved.lst refilter_raw.lst refilter_raw_excluded.lst
            git commit -m "[auto] Filter external domains, keep RU TLDs and RU GeoIP $(date '+%Y-%m-%d %H:%M:%S')"
            git pull origin main --rebase
            git push
          fi