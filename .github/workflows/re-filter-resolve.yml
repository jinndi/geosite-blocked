name: Check and Filter External Domains

on:
  workflow_dispatch:
  schedule:
    # Запуск каждое воскресенье в 06:37 UTC (09:37 МСК)
    - cron: '37 6 * * 0'

jobs:
  process-external-domains:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install dnspython

      - name: Download, resolve and filter domains
        run: |
          python -c "
          import os
          import urllib.request
          import concurrent.futures
          import dns.resolver

          url = 'https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/domains_all.lst'
          folder = 'data'
          dst_lst = os.path.join(folder, 'refilter_resolved.lst')
          raw_lst = 'refilter_all.lst'
          excluded_lst = 'refilter_no_resolve.lst'

          if not os.path.exists(folder):
              os.makedirs(folder)

          # 1. Скачивание списка доменов
          print(f'Скачивание списка доменов из: {url}')
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8')
              
              # Очищаем строки от пробелов и пустых элементов
              raw_domains = [line.strip() for line in content.splitlines() if line.strip() and not line.startswith('#')]
              print(f'Загружено доменов: {len(raw_domains)}')
          except Exception as e:
              print(f'Ошибка при скачивании файла: {e}')
              exit(1)

          # Сохраняем исходный необработанный список в корень
          with open(raw_lst, 'w', encoding='utf-8') as raw_f:
              for d in raw_domains:
                  raw_f.write(f'{d}\n')

          # 2. Настройка DNS-резолвера
          resolver = dns.resolver.Resolver()
          resolver.timeout = 2.5
          resolver.lifetime = 4.0

          def check_domain(domain):
              # Фильтр 1: Проверка на доменную зону .ua
              if domain.endswith('.ua'):
                  return domain, False, 'TLD_UA'

              # Фильтр 2: Проверка на наличие 4 и более цифр в названии домена
              digit_count = sum(c.isdigit() for c in domain)
              if digit_count >= 4:
                  return domain, False, f'TOO_MANY_DIGITS ({digit_count})'

              # Фильтр 3: DNS Резолв (A-запись)
              for attempt in range(2):
                  try:
                      answers = resolver.resolve(domain, 'A')
                      if answers:
                          return domain, True, 'OK'
                  except (dns.resolver.NXDOMAIN, dns.resolver.NoAnswer):
                      # Домен гарантированно не существует или не имеет A-записи
                      return domain, False, 'NO_RESOLVE'
                  except Exception:
                      # Временный таймаут или сетевой сбой -> повтор
                      continue
              
              return domain, False, 'NO_RESOLVE'

          resolved_domains = []
          failed_domains = []

          tld_ua_filtered = 0
          digits_filtered = 0
          no_resolve_filtered = 0

          print('Начинаем многопоточную проверку и DNS-резолв...')
          
          # 50 параллельных потоков
          with concurrent.futures.ThreadPoolExecutor(max_workers=50) as executor:
              results = list(executor.map(check_domain, raw_domains))

          for domain, is_ok, reason in results:
              if is_ok:
                  resolved_domains.append(domain)
              else:
                  failed_domains.append((domain, reason))
                  if reason == 'TLD_UA':
                      tld_ua_filtered += 1
                  elif reason.startswith('TOO_MANY_DIGITS'):
                      digits_filtered += 1
                  else:
                      no_resolve_filtered += 1

          # 3. Сохранение результатов
          with open(dst_lst, 'w', encoding='utf-8') as out_f:
              for d in sorted(resolved_domains):
                  out_f.write(f'{d}\n')

          with open(excluded_lst, 'w', encoding='utf-8') as ex_f:
              for d, reason in sorted(failed_domains):
                  ex_f.write(f'{d} # {reason}\n')

          print('\n--- ИТОГИ ПРОВЕРКИ ---')
          print(f'Всего обработано доменов: {len(raw_domains)}')
          print(f'Удалено из-за зоны .ua: {tld_ua_filtered}')
          print(f'Удалено из-за >= 4 цифр: {digits_filtered}')
          print(f'Удалено из-за ошибок резолва (NO_RESOLVE): {no_resolve_filtered}')
          print(f'Оригинальный список сохранен в: {raw_lst}')
          print(f'Успешно сохранено в: {dst_lst}')
          print(f'Исключения сохранены в: {excluded_lst}')
          "

      - name: Commit and Push changes
        env:
          TZ: "Europe/Moscow"
        run: |
          if [ -z "$(git status --porcelain data/refilter_resolved.lst refilter_all.lst refilter_no_resolve.lst)" ]; then
            echo "Изменений в файлах нет."
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/refilter_resolved.lst refilter_all.lst refilter_no_resolve.lst
            git commit -m "[auto] Check external domains resolve & filter .ua / digits $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi