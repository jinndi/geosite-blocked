name: Check and Filter External Domains

on:
  workflow_dispatch:
  schedule:
    # Запуск каждое воскресенье в 06:37 UTC (09:37 МСК)
    - cron: '37 6 * * 0'

jobs:
  process-external-domains:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install dnspython

      - name: Download, resolve and filter domains
        run: |
          python -c "
          import os
          import urllib.request
          import concurrent.futures
          import dns.resolver

          url = 'https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/domains_all.lst'
          folder = 'data'
          dst_lst = os.path.join(folder, 'domains_resolved.lst')
          excluded_lst = 'domains_no_resolve.txt'

          if not os.path.exists(folder):
              os.makedirs(folder)

          # 1. Скачивание списка доменов
          print(f'Скачивание списка доменов из: {url}')
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8')
              
              # Очищаем строки от пробелов и пустых элементов
              raw_domains = [line.strip() for line in content.splitlines() if line.strip() and not line.startswith('#')]
              print(f'Загружено доменов: {len(raw_domains)}')
          except Exception as e:
              print(f'Ошибка при скачивании файла: {e}')
              exit(1)

          # 2. Настройка DNS-резолвера
          resolver = dns.resolver.Resolver()
          resolver.timeout = 2.5
          resolver.lifetime = 4.0

          def check_domain(domain):
              # Делаем до 2 попыток резолва на случай временного сетевого лага
              for attempt in range(2):
                  try:
                      answers = resolver.resolve(domain, 'A')
                      if answers:
                          return domain, True  # Удалось отрезолвить
                  except (dns.resolver.NXDOMAIN, dns.resolver.NoAnswer):
                      # Домен гарантированно не существует или не имеет A-записи
                      return domain, False
                  except Exception:
                      # Временный таймаут или сетевой сбой -> повтор
                      continue
              
              return domain, False

          resolved_domains = []
          failed_domains = []

          print('Начинаем многопоточный DNS-резолв...')
          
          # 50 параллельных потоков
          with concurrent.futures.ThreadPoolExecutor(max_workers=50) as executor:
              results = list(executor.map(check_domain, raw_domains))

          for domain, is_resolved in results:
              if is_resolved:
                  resolved_domains.append(domain)
              else:
                  failed_domains.append(domain)

          # 3. Сохранение результатов
          with open(dst_lst, 'w', encoding='utf-8') as out_f:
              for d in sorted(resolved_domains):
                  out_f.write(f'{d}\n')

          with open(excluded_lst, 'w', encoding='utf-8') as ex_f:
              for d in sorted(failed_domains):
                  ex_f.write(f'{d}\n')

          print('\n--- ИТОГИ ПРОВЕРКИ ---')
          print(f'Всего обработано доменов: {len(raw_domains)}')
          print(f'Успешно отрезолвлено (сохранено в {dst_lst}): {len(resolved_domains)}')
          print(f'Не удалось отрезолвить (сохранено в {excluded_lst}): {len(failed_domains)}')
          "

      - name: Commit and Push changes
        env:
          TZ: "Europe/Moscow"
        run: |
          if [ -z "$(git status --porcelain data/domains_resolved.lst domains_no_resolve.txt)" ]; then
            echo "Изменений в файлах нет."
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/domains_resolved.lst domains_no_resolve.txt
            git commit -m "[auto] Check external domains resolve $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi