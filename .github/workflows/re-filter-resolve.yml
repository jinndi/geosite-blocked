name: Check and Filter External Domains

on:
  workflow_dispatch:
  schedule:
    # Запуск 1 и 15 числа каждого месяца в 06:37 UTC
    - cron: '37 6 1,15 * *'

jobs:
  process-external-domains:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install dnspython

      - name: Download, resolve and filter domains
        run: |
          python -c "
          import os
          import urllib.request
          import concurrent.futures
          import dns.resolver

          url = 'https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/domains_all.lst'
          folder = 'data'
          dst_lst = os.path.join(folder, 'refilter_resolved.lst')
          raw_lst = 'refilter_all.lst'
          excluded_lst = 'refilter_no_resolve.lst'

          # Разрешенные зоны (РФ)
          allowed_tlds = (
            '.moscow', '.ru', '.su', '.tatar', '.рф', '.москва', '.дети',
            '.xn--80adxhks', '.xn--80asehdb', '.xn--80aswg', 
            '.xn--c1avg', '.xn--d1acj3b', '.xn--p1acf', '.xn--p1ai',
            '.ru.com', '.ru.net'
          )

          if not os.path.exists(folder):
              os.makedirs(folder)

          # 1. Скачивание списка доменов
          print(f'Скачивание списка доменов из: {url}')
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8')
              
              raw_domains = [line.strip() for line in content.splitlines() if line.strip() and not line.startswith('#')]
              print(f'Загружено всего доменов: {len(raw_domains)}')
          except Exception as e:
              print(f'Ошибка при скачивании файла: {e}')
              exit(1)

          # Сохраняем исходный необработанный список в корень
          with open(raw_lst, 'w', encoding='utf-8') as raw_f:
              for d in raw_domains:
                  raw_f.write(f'{d}\n')

          # 2. БЫСТРАЯ ПРЕДВАРИТЕЛЬНАЯ ФИЛЬТРАЦИЯ (Без сети)
          domains_to_resolve = []
          failed_domains = []

          not_ru_tld_filtered = 0
          digits_filtered = 0

          for domain in raw_domains:
              domain_lower = domain.lower()

              # Фильтр 1: Зона
              if not domain_lower.endswith(allowed_tlds):
                  failed_domains.append((domain, 'NOT_RU_TLD'))
                  not_ru_tld_filtered += 1
                  continue

              # Фильтр 2: Цифры
              try:
                  decoded_domain = domain.encode('idna').decode('utf-8') if not domain_lower.startswith('xn--') else domain.encode('utf-8').decode('idna')
              except Exception:
                  decoded_domain = domain

              main_name = decoded_domain.rsplit('.', 1)[0]
              digit_count = sum(c.isdigit() for c in main_name)

              if digit_count >= 4:
                  failed_domains.append((domain, f'TOO_MANY_DIGITS ({digit_count})'))
                  digits_filtered += 1
                  continue

              domains_to_resolve.append(domain)

          print(f'Отсеяно по TLD: {not_ru_tld_filtered}')
          print(f'Отсеяно по цифрам: {digits_filtered}')
          print(f'Отправляется на DNS-резолв: {len(domains_to_resolve)}')

          # Получаем системные DNS из /etc/resolv.conf
          system_resolver = dns.resolver.Resolver()
          system_nameservers = system_resolver.nameservers

          # Объединяем локальные DNS с надежными публичными (убирая дубли)
          combined_nameservers = list(dict.fromkeys(system_nameservers + [
              '1.1.1.1', '1.0.0.1',           # Cloudflare
              '8.8.8.8', '8.8.4.4'            # Google
          ]))

          # 3. ФУНКЦИЯ ПРОВЕРКИ ТОЛЬКО ПО A-ЗАПИСИ С RETRY
          def resolve_domain(domain):
              # Локальный резолвер для каждого потока (предотвращает внутренние блокировки)
              resolver = dns.resolver.Resolver(configure=False)
              resolver.nameservers = combined_nameservers
              resolver.timeout = 2.0
              resolver.lifetime = 3.0

              # До 3-х попыток в случае сетевого таймаута
              for attempt in range(3):
                  try:
                      answers = resolver.resolve(domain, 'A')
                      if answers:
                          return domain, True, 'OK'
                  except (dns.resolver.NXDOMAIN, dns.resolver.NoAnswer):
                      # Если DNS строго ответил, что домена/A-записи нет — мгновенный отказ
                      return domain, False, 'NO_RESOLVE'
                  except Exception:
                      # При таймауте пробуем еще раз
                      pass

              # Если за 3 попытки A-запись так и не вернулась — жестко выносим NO_RESOLVE
              return domain, False, 'NO_RESOLVE'

          resolved_domains = []
          no_resolve_filtered = 0

          print('Начинаем многопоточный DNS-резолв (150 потоков)...')
          
          with concurrent.futures.ThreadPoolExecutor(max_workers=150) as executor:
              results = list(executor.map(resolve_domain, domains_to_resolve))

          for domain, is_ok, reason in results:
              if is_ok:
                  resolved_domains.append(domain)
              else:
                  failed_domains.append((domain, reason))
                  no_resolve_filtered += 1

          # 4. Сохранение результатов
          with open(dst_lst, 'w', encoding='utf-8') as out_f:
              for d in sorted(resolved_domains):
                  out_f.write(f'{d}\n')

          with open(excluded_lst, 'w', encoding='utf-8') as ex_f:
              for d, reason in sorted(failed_domains):
                  ex_f.write(f'{d} # {reason}\n')

          print('\n--- ИТОГИ ПРОВЕРКИ ---')
          print(f'Всего обработано доменов: {len(raw_domains)}')
          print(f'Удалено (не зоны РФ): {not_ru_tld_filtered}')
          print(f'Удалено из-за >= 4 цифр: {digits_filtered}')
          print(f'Удалено из-за ошибок резолва (NO_RESOLVE): {no_resolve_filtered}')
          print(f'Оригинальный список сохранен в: {raw_lst}')
          print(f'Успешно сохранено доменов в: {dst_lst} ({len(resolved_domains)} шт.)')
          print(f'Исключения сохранены в: {excluded_lst}')
          "

      - name: Commit and Push changes
        env:
          TZ: "Europe/Moscow"
        run: |
          if [ -z "$(git status --porcelain data/refilter_resolved.lst refilter_all.lst refilter_no_resolve.lst)" ]; then
            echo "Изменений в файлах нет."
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/refilter_resolved.lst refilter_all.lst refilter_no_resolve.lst
            git commit -m "[auto] Check external domains resolve & filter RU TLD / digits $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi