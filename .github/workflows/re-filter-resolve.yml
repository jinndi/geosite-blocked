name: Check and Filter External Domains

on:
  workflow_dispatch:
  schedule:
    # Запуск каждое воскресенье в 06:37 UTC (09:37 МСК)
    - cron: '37 6 * * 0'

jobs:
  process-external-domains:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install dnspython geoip2

      - name: Download, resolve and filter domains
        run: |
          python -c "
          import os
          import urllib.request
          import concurrent.futures
          import dns.resolver
          import geoip2.database

          url = 'https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/domains_all.lst'
          folder = 'data'
          dst_lst = os.path.join(folder, 'refilter_resolved.lst')
          raw_lst = 'refilter_all.lst'
          excluded_lst = 'refilter_no_resolve.lst'
          geoip_db_path = 'GeoLite2-Country.mmdb'

          target_country_codes = {'RU', 'BY', 'KZ'}

          if not os.path.exists(folder):
              os.makedirs(folder)

          # 1. Подключение GeoIP базы
          reader = None
          if os.path.exists(geoip_db_path):
              try:
                  reader = geoip2.database.Reader(geoip_db_path)
                  print('База GeoIP успешно загружена.')
              except Exception as e:
                  print(f'Ошибка загрузки GeoIP: {e}')
          else:
              print(f'Предупреждение: Файл {geoip_db_path} не найден!')

          # 2. Скачивание списка доменов
          print(f'Скачивание списка доменов из: {url}')
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8')
              
              # Очищаем строки от пробелов и пустых элементов
              raw_domains = [line.strip() for line in content.splitlines() if line.strip() and not line.startswith('#')]
              print(f'Загружено доменов: {len(raw_domains)}')
          except Exception as e:
              print(f'Ошибка при скачивании файла: {e}')
              exit(1)

          # Сохраняем исходный необработанный список в корень
          with open(raw_lst, 'w', encoding='utf-8') as raw_f:
              for d in raw_domains:
                  raw_f.write(f'{d}\n')

          # 3. Настройка DNS-резолвера
          resolver = dns.resolver.Resolver()
          resolver.timeout = 2.5
          resolver.lifetime = 4.0

          def check_domain(domain):
              # Фильтр 1: Проверка на наличие 4 и более цифр в названии домена
              digit_count = sum(c.isdigit() for c in domain)
              if digit_count >= 4:
                  return domain, False, f'TOO_MANY_DIGITS ({digit_count})'

              # Фильтр 2: DNS Резолв и GeoIP проверка
              answers = None
              for attempt in range(2):
                  try:
                      answers = resolver.resolve(domain, 'A')
                      break
                  except (dns.resolver.NXDOMAIN, dns.resolver.NoAnswer):
                      return domain, False, 'NO_RESOLVE'
                  except Exception:
                      continue

              if answers:
                  if reader:
                      ip_country = None
                      for rdata in answers:
                          ip = rdata.to_text()
                          try:
                              response = reader.country(ip)
                              iso_code = response.country.iso_code
                              if iso_code in target_country_codes:
                                  # Найдено совпадение с RU/BY/KZ -> оставляем
                                  return domain, True, f'GeoIP ({iso_code})'
                              elif iso_code:
                                  ip_country = iso_code
                          except Exception:
                              pass
                      
                      # Ни один IP-адрес домена не попал в RU/BY/KZ -> исключаем
                      country_str = ip_country if ip_country else 'UNKNOWN'
                      return domain, False, f'GeoIP_OUT ({country_str})'
                  else:
                      # Если базы GeoIP нет, не можем гарантировать принадлежность
                      return domain, False, 'NO_GEOIP_DB'
              else:
                  return domain, False, 'NO_RESOLVE'

          resolved_domains = []
          failed_domains = []

          digits_filtered = 0
          geoip_out_filtered = 0
          no_resolve_filtered = 0

          print('Начинаем многопоточную проверку, DNS-резолв и GeoIP-фильтрацию (оставляем RU/BY/KZ)...')
          
          # 50 параллельных потоков
          with concurrent.futures.ThreadPoolExecutor(max_workers=50) as executor:
              results = list(executor.map(check_domain, raw_domains))

          for domain, is_ok, reason in results:
              if is_ok:
                  resolved_domains.append(domain)
              else:
                  failed_domains.append((domain, reason))
                  if reason.startswith('TOO_MANY_DIGITS'):
                      digits_filtered += 1
                  elif reason.startswith('GeoIP_OUT'):
                      geoip_out_filtered += 1
                  else:
                      no_resolve_filtered += 1

          # 4. Сохранение результатов
          with open(dst_lst, 'w', encoding='utf-8') as out_f:
              for d in sorted(resolved_domains):
                  out_f.write(f'{d}\n')

          with open(excluded_lst, 'w', encoding='utf-8') as ex_f:
              for d, reason in sorted(failed_domains):
                  ex_f.write(f'{d} # {reason}\n')

          print('\n--- ИТОГИ ПРОВЕРКИ ---')
          print(f'Всего обработано доменов: {len(raw_domains)}')
          print(f'Удалено из-за >= 4 цифр: {digits_filtered}')
          print(f'Удалено т.к. IP НЕ из RU/BY/KZ: {geoip_out_filtered}')
          print(f'Удалено из-за ошибок резолва (NO_RESOLVE): {no_resolve_filtered}')
          print(f'Оригинальный список сохранен в: {raw_lst}')
          print(f'Сохранено доменов с IP из RU/BY/KZ в: {dst_lst} ({len(resolved_domains)} шт.)')
          print(f'Исключения сохранены в: {excluded_lst}')
          "

      - name: Commit and Push changes
        env:
          TZ: "Europe/Moscow"
        run: |
          if [ -z "$(git status --porcelain data/refilter_resolved.lst refilter_all.lst refilter_no_resolve.lst)" ]; then
            echo "Изменений в файлах нет."
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/refilter_resolved.lst refilter_all.lst refilter_no_resolve.lst
            git commit -m "[auto] Check external domains resolve & keep RU/BY/KZ IP $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi