name: Update GeoIP Database

on:
  workflow_dispatch:
  schedule:
    # Запуск каждую субботу в 05:37 UTC (08:37 МСК)
    - cron: '37 5 * * 6'

jobs:
  update-geoip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GeoLite2 Country Database
        run: |
          curl -L "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb" -o GeoLite2-Country.mmdb

      - name: Commit and Push GeoIP DB
        env:
          TZ: "Europe/Moscow"
        run: |
          if [ -z "$(git status --porcelain GeoLite2-Country.mmdb)" ]; then
            echo "База GeoIP не изменилась, пропускаем коммит."
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            git add GeoLite2-Country.mmdb
            git commit -m "[auto] Update GeoLite2-Country.mmdb $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi